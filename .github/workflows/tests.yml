name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: unittest ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version the package advertises: requires-python is >=3.11 and
        # the classifiers list 3.11-3.13. 3.14 is what the project is developed
        # on, so it is tested rather than merely tolerated.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -B -m unittest discover -s tests -t .

  locale:
    # The kernel decodes requests as UTF-8 no matter what the host codepage is.
    # A locale-dependent codec silently rewrote non-ASCII request text into
    # different valid characters and still answered ok=true, so a comment or
    # rename landed in the database as mojibake. Only a non-UTF-8 locale run
    # catches a regression here.
    name: non-UTF-8 locale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run suite under a legacy single-byte locale
        env:
          LC_ALL: C
          LANG: C
          PYTHONIOENCODING: latin-1
        run: python -B -m unittest discover -s tests -t .

  sdist:
    # MANIFEST.in claims the sdist is self-contained. Prove it: build the
    # tarball, unpack it somewhere else, and run the documented test command
    # from there. Without the skills/, scripts/, docs/ and benches/ trees this
    # job fails with FileNotFoundError even though the repo checkout is green.
    name: sdist is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - name: Build sdist
        run: python -m build --sdist --outdir dist
      - name: Unpack and run its own test suite
        run: |
          mkdir -p /tmp/from-sdist
          tar -xzf dist/*.tar.gz -C /tmp/from-sdist --strip-components=1
          cd /tmp/from-sdist
          python -B -m unittest discover -s tests -t .

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy
      - run: python -m ruff check src tests scripts benches examples
      # Config lives in pyproject; both are clean today, so any new finding is
      # a regression rather than pre-existing debt to argue about.
      - run: python -m mypy
